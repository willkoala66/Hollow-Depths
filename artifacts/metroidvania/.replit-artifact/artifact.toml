kind = "web"
previewPath = "/"
title = "Hollow Depths"
version = "1.0.0"
id = "artifacts/metroidvania"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21521

[services.development]
run = "pnpm --filter @workspace/metroidvania run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/metroidvania", "run", "build" ]
publicDir = "artifacts/metroidvania/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21521"
BASE_PATH = "/"

[[services]]
name = "API Server"
paths = [ "/api" ]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/api-server", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs" ]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
