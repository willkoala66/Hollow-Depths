name: Deploy Hollow-Depths
run-name: ${{ github.actor }} is Deploying Hollow-Depths
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    env: 
      BASE_PATH: "./"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          version: 12
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - run: pnpm install
      - name: Build
        run: PORT=8080 pnpm build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/metroidvania/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
