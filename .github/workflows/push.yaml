name: Gitlab-PUSH
run-name: ${{ github.actor }} is Pushing to GitLab
on: [push, pull_request, workflow_dispatch]
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: git-bash
        # You may pin to the exact commit or the version.
        # uses: pkg-src/github-action-git-bash@d7e3f57b86fcf5d919a5ba685d459583735b7611
        uses: pkg-src/github-action-git-bash@v1.1
      - name: Add remote to repo
        run: git remote add Gitlab https://glpat-KaLTdyr0dLWZzlnP1jK59WM6MQpvOjEKdTpxbDhieg8.01.171kfb4mc@gitlab.com/e4te-devs/Hollow-Depths.git

      - name: push to gitlab
        run: git push Gitlab
